name: Build Jarvis APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configurar SDK de Android (¡El paso que faltaba!)
        uses: android-actions/setup-android@v3
      - name: Instalar dependencias
        run: npm install
      - name: Crear la plataforma Android
        run: npx cap add android
      - name: Configurar ruta del SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew
      - name: Compilar la APK
        run: cd android && ./gradlew assembleDebug
      - name: Subir el archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
