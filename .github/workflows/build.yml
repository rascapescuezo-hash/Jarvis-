name: Build Jarvis APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias del proyecto
        run: npm install
      - name: Agregar la plataforma Android
        run: npx cap add android
      - name: Crear archivo de configuración del SDK (¡Fallo solucionado!)
        run: echo "sdk.dir=${{ runner.tool_cache }}/android-sdk" > android/local.properties
      - name: Sincronizar Capacitor con Android
        run: npx cap sync android
      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew
      - name: Compilar la APK definitiva
        run: cd android && ./gradlew assembleDebug
      - name: Subir el archivo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
